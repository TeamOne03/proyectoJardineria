    <div id="contenedor">
        <main class="perfil">
            <form class="formaPago">
                <h2>Agregar una tarjeta de crédito o débito</h2>
                
                <div class="formaPago2">
                    <label for="nombre">Nombre en la tarjeta:</label>
                    <input type="text" id="nombre" name="nombre" required><br><br>
                </div>
                <div class="formaPago2">
                    <label for="numTarjeta">Número en la tarjeta:</label>
                    <input type="text" id="numTarjeta" name="numTarjeta" maxlength="19" required><br><br>
                </div>
                <div class="formaPago3">
                    <label for="fechaExpiracion">Fecha de expiración:</label>
                    <select id="meses" name="meses" required>
                        <option value="01">01</option>
                        <option value="02">02</option>
                        <option value="03">03</option>
                        <option value="04">04</option>
                        <option value="05">05</option>
                        <option value="06">06</option>
                        <option value="07">07</option>
                        <option value="08">08</option>
                        <option value="09">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                    <select id="años" name="años" required>
                    </select>
                    <br><br>
                </div>
                <div class="formaPago4">
                    <label for="cvv">Código de seguridad (CVV):</label>
                    <input type="password" id="cvv" name="cvv" maxlength="4" required><br><br>
                </div>
                <div class="botonPago">
                    <button type="submit">Agregar tu tarjeta</button>
                </div>
            </form>
        </main>
